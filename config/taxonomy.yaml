taxonomy:
  id: edm_subgenre
  version: 0.1.0
  name: 'EDM Genre and Subgenre Taxonomy'
  description: 'User-defined taxonomy for weak labeling, transfer learning, and library tagging.'
  task: hierarchical_multi_label
  source_order_is_stable: true

labeling_policy:
  prefer_most_specific_supported_label: true
  allow_multiple_labels: true
  recommended_max_leaf_labels: 2
  allow_broad_parent_as_fallback: true
  derive_parent_labels: true
  allow_unlabeled_when_uncertain: true
  classify_recording_not_artist: true
  bpm_is_soft_evidence_only: true
  notes:
    - 'Do not assign a subgenre solely because the artist is commonly associated with it.'
    - 'Do not force a specific child label when only the broad parent is supported.'
    - 'Genre, mood, character, and energy are separate prediction targets.'

boundary_rules:
  - labels: [future_bass, melodic_dubstep]
    guidance: 'Prefer Future Bass when supersaw stabs, vocal chops, bright melodies, and stuttered chords dominate; prefer Melodic Dubstep when emotional/cinematic writing is carried by a dubstep-oriented bass and drop structure. Multi-label is allowed when both are strongly supported.'
  - labels: [progressive_house, melodic_house]
    guidance: 'Prefer Progressive House for long evolving builds, layered melodies, and large emotional peaks; prefer Melodic House when the track is more groove-focused, song-like, warm, and melody-led.'
  - labels: [melodic_house, melodic_techno]
    guidance: 'Prefer Melodic House when house groove and song-like warmth dominate; prefer Melodic Techno when emotional melody sits over a more driving techno rhythmic framework.'
  - labels: [future_house, bass_house]
    guidance: 'Prefer Future House for bouncy metallic bass and UK-garage-influenced swing; prefer Bass House for aggressive bass-forward production and heavy mid-range growls.'
  - labels: [liquid_dnb, atmospheric_dnb]
    guidance: 'Prefer Liquid D&B for smooth pads, vocals, musical breakdowns, and rolling beats; prefer Atmospheric D&B when lush ambient/jazz-tinged texture and deep spaciousness dominate.'
  - labels: [deep_dubstep, 140_deep_bass]
    guidance: 'Both emphasize sub-bass and sparse half-time space. Prefer Deep Dubstep for the broader deep/minimal dubstep tradition; prefer 140 / Deep Bass for the modern UK-underground 140 framing when that distinction is supported by evidence.'
  - labels: [uplifting_trance, progressive_trance]
    guidance: 'Prefer Uplifting Trance for soaring melodies, large breakdowns, and euphoric drops; prefer Progressive Trance for gradual development, subtler evolution, and a deeper groove.'
  - labels: [midtempo, midtempo_bass]
    guidance: 'Use Midtempo as the broad parent/fallback; prefer Midtempo Bass when pulsing grooves, hypnotic kicks, and gritty mid-bass design are defining features.'

